name: build stage environment

on:
  pull_request:
    paths:
      - 'build/Dockerfile.pf'
      - 'tests/test-build-stage-environment.sh'
      - 'tests/test-public-ci-workflows.sh'
      - 'tests/prove-public-ci-fit.sh'
      - '.github/workflows/build-stage-environment.yml'

permissions:
  contents: read

concurrency:
  group: build-stage-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-stage-environment:
    runs-on: [self-hosted, pf-public-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify public runner contract
        run: tests/test-public-ci-workflows.sh
      - name: Prove workload fits the public runner envelope
        run: tests/prove-public-ci-fit.sh
      - name: Prove BuildKit tracing is absent from RUN
        run: tests/test-build-stage-environment.sh
