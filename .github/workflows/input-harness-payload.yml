name: input harness payload

on:
  pull_request:
    paths:
      - tests/input-harness/**
      - tests/test-input-harness-selftest.py
      - tests/test-input-harness-selftest.sh
      - tests/uinput_inventory.py
      - tests/uinput-inventory.txt
      - snapshot-date.txt
      - .github/workflows/input-harness-payload.yml
      - scripts/pf-artifact-intake-put
      - scripts/lib/artifact-store-config.sh
  push:
    branches: [main]
    paths:
      - tests/input-harness/**
      - tests/test-input-harness-selftest.py
      - tests/test-input-harness-selftest.sh
      - tests/uinput_inventory.py
      - tests/uinput-inventory.txt
      - snapshot-date.txt
      - .github/workflows/input-harness-payload.yml
      - scripts/pf-artifact-intake-put
      - scripts/lib/artifact-store-config.sh

permissions:
  contents: read

env:
  PF_BUILD_IMAGE: 10.0.32.86:5555/pocketforge/build:10.3-2021.07-bookworm-rust-1.88.0-r4@sha256:b4616c62629d24f2ccf72935ab9db2303457954a756d59c929121e873d23390e

concurrency:
  group: input-harness-payload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payload:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify the runner's approved insecure-registry builder
        run: docker buildx inspect pf-insecure --bootstrap
      - name: Stage pinned source contexts outside BuildKit
        run: |
          set -euo pipefail
          source tests/input-harness/guest-payload.pins
          checkouts="$RUNNER_TEMP/payload-checkouts"
          contexts="$RUNNER_TEMP/payload-contexts"
          test ! -e "$checkouts"
          test ! -e "$contexts"
          mkdir "$checkouts" "$contexts"
          stage_source() {
            name=$1
            url=$2
            commit=$3
            checkout="$checkouts/$name"
            context="$contexts/$name"
            git clone --filter=blob:none --no-checkout "$url" "$checkout"
            git -C "$checkout" checkout --detach "$commit"
            test "$(git -C "$checkout" rev-parse HEAD)" = "$commit"
            mkdir "$context"
            git -C "$checkout" archive --format=tar "$commit" | tar -xf - -C "$context"
            printf '%s\n' "$commit" > "$context/.pf-source-revision"
          }
          stage_source sdl "$SDL_URL" "$SDL_COMMIT"
          stage_source gamescope "$GAMESCOPE_URL" "$GAMESCOPE_COMMIT"
          stage_source libei "$LIBEI_URL" "$LIBEI_COMMIT"
      - name: Build reproducible arm64 attachment
        timeout-minutes: 40
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/input-harness-payload"
          test ! -e "$out"
          cache_args=()
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            cache_args+=(--no-cache)
            echo 'input-harness-payload-cache-mode=cold'
          else
            echo 'input-harness-payload-cache-mode=normal'
          fi
          docker buildx build --builder pf-insecure --pull=false --progress=plain "${cache_args[@]}" \
            --build-arg PF_BUILD_IMAGE="$PF_BUILD_IMAGE" \
            --build-arg PF_APT_PROXY=http://10.0.32.86:3142 \
            --build-context sdl-src="$RUNNER_TEMP/payload-contexts/sdl" \
            --build-context gamescope-src="$RUNNER_TEMP/payload-contexts/gamescope" \
            --build-context libei-src="$RUNNER_TEMP/payload-contexts/libei" \
            --label pf.bead=tsp-ihne1.56.4 \
            -f tests/input-harness/Containerfile.guest-payload \
            --output "type=local,dest=$out" . 2>&1 | tee "$RUNNER_TEMP/payload-build.log"
          for evidence in apt-sources.txt runtime-packages.tsv payload-files.tsv; do
            echo "--- BEGIN $evidence ---"
            cat "$out/$evidence"
            echo "--- END $evidence ---"
          done
          tests/input-harness/verify-guest-payload.sh \
            --payload "$out/input-harness.squashfs" \
            --manifest "$out/manifest.json"
      - id: receipt
        name: Create verified CI receipt
        run: |
          set -euo pipefail
          source tests/input-harness/guest-payload.lock
          out="$RUNNER_TEMP/input-harness-payload"
          receipt="$out/CI-RECEIPT.txt"
          payload_sha="$(sha256sum "$out/input-harness.squashfs" | cut -d' ' -f1)"
          manifest_sha="$(sha256sum "$out/manifest.json" | cut -d' ' -f1)"
          test "$payload_sha" = "$PF_INPUT_HARNESS_PAYLOAD_SHA256"
          test "$manifest_sha" = "$PF_INPUT_HARNESS_MANIFEST_SHA256"
          {
            echo 'schema=pocketforge.input-harness-payload-ci-receipt/v1'
            echo "producer_commit=$GITHUB_SHA"
            echo 'verification=PASS'
            echo "payload_sha256=$payload_sha"
            echo "payload_bytes=$PF_INPUT_HARNESS_PAYLOAD_BYTES"
            echo "manifest_sha256=$manifest_sha"
          } > "$receipt"
          receipt_sha="$(sha256sum "$receipt" | cut -d' ' -f1)"
          echo "input-harness-payload-ci-receipt=PASS payload_sha256=$payload_sha manifest_sha256=$manifest_sha receipt_sha256=$receipt_sha"
          echo "payload_sha256=$payload_sha" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$receipt_sha" >> "$GITHUB_OUTPUT"
      - name: Put verified payload, manifest and receipt into trusted intake
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/input-harness-payload"
          put_and_check() {
            file=$1
            expected=$2
            result="$(scripts/pf-artifact-intake-put "$file")"
            printf '%s\n' "$result"
            actual="$(sed -n 's/^intake_status=PASS .* sha256=\([0-9a-f]\{64\}\) .*$/\1/p' <<< "$result")"
            test "$actual" = "$expected"
          }
          put_and_check "$out/input-harness.squashfs" '${{ steps.receipt.outputs.payload_sha256 }}'
          put_and_check "$out/manifest.json" '${{ steps.receipt.outputs.manifest_sha256 }}'
          put_and_check "$out/CI-RECEIPT.txt" '${{ steps.receipt.outputs.receipt_sha256 }}'
      - name: Remove staged source contexts
        if: always()
        run: |
          for path in "$RUNNER_TEMP/payload-checkouts" "$RUNNER_TEMP/payload-contexts" "$RUNNER_TEMP/input-harness-payload"; do
            if test -d "$path"; then
              find "$path" -mindepth 1 -delete
              rmdir "$path"
            fi
          done
