name: App policy paired contract

on:
  pull_request:
    paths:
      - '.github/workflows/app-policy-pair.yml'
      - 'scripts/render-app-runtime-root.py'
      - 'scripts/render-platform-capabilities.py'
      - 'scripts/install-poolsuite.sh'
      - 'scripts/check-runtime-path-producers.py'
      - 'scripts/check-app-root-bind-targets.py'
      - 'scripts/install-steamlink-first-run.sh'
      - 'build/app-policy-a133-open-v1.json'
      - 'build/app-policy-a133-open-g1-v1.json'
      - 'build/pf-app@org.pocketforge.steamlink.service.d/10-policy.conf'
      - 'rootfs-overlay/usr/share/pocketforge/runtime-path-producers.json'
      - 'rootfs-overlay/usr/share/pocketforge/runtime-path-producers-g1.json'
      - 'build/Dockerfile.pf'
      - 'tests/test-app-runtime-root.sh'
      - 'tests/test_app_runtime_root.py'
      - 'tests/test_app_runtime_abi.py'
      - 'tests/test-default-app-platform.sh'
      - 'tests/test-poolsuite-app-policy.sh'
      - 'tests/test-steamlink-app-policy.sh'
      - 'tests/test-steamlink-first-run-install.sh'
      - 'tests/test-steamlink-rooted-launch.py'
      - 'tests/run-app-policy-pair.sh'
      - 'apps/steamlink/app.toml'
      - 'tests/test-poolsuite-rootfs-install.sh'
      - 'tests/test-poolsuite-variant-stage.sh'
      - 'tests/test-runtime-path-producers.sh'
      - 'tests/test-hang-sampler-image.sh'
      - 'scripts/check-hang-sampler-image.py'
      - 'scripts/build-rootfs.sh'
      - 'rootfs-overlay/usr/lib/sysusers.d/pf-hang-sampler.conf'
      - 'rootfs-overlay/usr/lib/tmpfiles.d/pf-hang-sampler.conf'
      - 'rootfs-overlay/etc/systemd/system/pf-hang-sampler.service'
      - 'rootfs-overlay/etc/systemd/system/pf-hang-sampler.socket'
      - 'rootfs-overlay/etc/systemd/system/pf-session-authorityd.service.d/20-hang-sampler.conf'
      - 'tests/fixtures/app-policy/platform-capabilities-a133-open.toml'

permissions:
  contents: read

jobs:
  pair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 15
    env:
      PF_PAIR_OCI_IMAGE: 10.0.32.86:5555/pocketforge/ci-rust@sha256:801f15f7e8fd20b449e3b0d0a7a56d632e28dae825b251a19a30e6f8b32bd8e9
      PF_IMAGE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          repository: pocketforge-os/runtime
          ref: 7d92ef9fa5a6c1dca21d7f0e1e568c0cf2de6bc8
          path: runtime-pair
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          repository: pocketforge-os/launcher
          ref: 2df03a48a91f7b4dfe2626848af80f4eca6398da
          path: launcher-pair
      - name: Prove exact source pair in the pinned OCI toolchain
        run: |
          set -euo pipefail
          export PF_PAIR_OUTPUT="$RUNNER_TEMP/app-policy-pair"
          printf 'PF_PAIR_OUTPUT=%s\n' "$PF_PAIR_OUTPUT" >> "$GITHUB_ENV"
          test "$(git -C runtime-pair rev-parse HEAD)" = 7d92ef9fa5a6c1dca21d7f0e1e568c0cf2de6bc8
          test "$(git -C launcher-pair rev-parse HEAD)" = 2df03a48a91f7b4dfe2626848af80f4eca6398da
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PF_IMAGE_PR_HEAD" HEAD
          test ! -e "$PF_PAIR_OUTPUT"
          mkdir "$PF_PAIR_OUTPUT"
          printf 'runtime_candidate=%s launcher_candidate=%s image_candidate=%s image_pr_head=%s\n' \
            "$(git -C runtime-pair rev-parse HEAD)" \
            "$(git -C launcher-pair rev-parse HEAD)" "$(git rev-parse HEAD)" "$PF_IMAGE_PR_HEAD" \
            | tee "$PF_PAIR_OUTPUT/source-receipt.txt"
          # The builder's provisioned OCI service; no host Rust or service changes.
          name="app-policy-pair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # The builder already provisions Skopeo for the LAN HTTP registry;
          # avoid changing its daemon registry configuration.
          printf '{"auths":{}}\n' > "$PF_PAIR_OUTPUT/registry-anonymous.json"
          skopeo inspect --authfile "$PF_PAIR_OUTPUT/registry-anonymous.json" --raw --tls-verify=false "docker://$PF_PAIR_OCI_IMAGE" \
            > "$PF_PAIR_OUTPUT/oci-manifest.json"
          printf '%s  %s\n' "${PF_PAIR_OCI_IMAGE##*@sha256:}" "$PF_PAIR_OUTPUT/oci-manifest.json" \
            | sha256sum -c -
          manifest_id=$(python3 -c 'import json,sys; entries=[m for m in json.load(open(sys.argv[1]))["manifests"] if m.get("platform")=={"architecture":"amd64","os":"linux"}]; assert len(entries)==1; print(entries[0]["digest"])' \
            "$PF_PAIR_OUTPUT/oci-manifest.json")
          [[ "$manifest_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          platform_image="${PF_PAIR_OCI_IMAGE%@*}@$manifest_id"
          skopeo inspect --authfile "$PF_PAIR_OUTPUT/registry-anonymous.json" --raw --tls-verify=false \
            "docker://$platform_image" > "$PF_PAIR_OUTPUT/platform-manifest.json"
          printf '%s  %s\n' "${manifest_id#sha256:}" "$PF_PAIR_OUTPUT/platform-manifest.json" | sha256sum -c -
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["config"]["digest"])' \
            "$PF_PAIR_OUTPUT/platform-manifest.json")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          skopeo copy --src-authfile "$PF_PAIR_OUTPUT/registry-anonymous.json" \
            --src-tls-verify=false \
            "docker://$platform_image" "docker-archive:$PF_PAIR_OUTPUT/toolchain.tar:app-policy-pair:verified"
          docker load --input "$PF_PAIR_OUTPUT/toolchain.tar"
          test "$(docker image inspect --format '{{.Id}}' "$image_id")" = "$image_id"
          rm "$PF_PAIR_OUTPUT/toolchain.tar"
          printf 'paired_toolchain=%s image_id=%s\n' "$PF_PAIR_OCI_IMAGE" "$image_id"
          docker run --rm --pull never --name "$name" --init \
            --user "$(id -u):$(id -g)" --network none \
            --cpus 2 --memory 2g --pids-limit 512 \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=256m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$PF_PAIR_OUTPUT,dst=/work" \
            --workdir /workspace "$image_id" \
            bash tests/run-app-policy-pair.sh

      - name: Require real rooted launch namespace on the capable builder
        run: |
          set -euo pipefail
          cat "$PF_PAIR_OUTPUT/source-receipt.txt" "$PF_PAIR_OUTPUT/SHA256SUMS"
          (cd "$PF_PAIR_OUTPUT/target/debug" && sha256sum -c "$PF_PAIR_OUTPUT/SHA256SUMS")
          export PF_APP_LAUNCH="$PF_PAIR_OUTPUT/target/debug/pf-app-launch"
          export PF_APP_POLICY_RENDER="$PF_PAIR_OUTPUT/target/debug/pf-app-policy-render"
          # All real namespace and policy negatives must execute. Landlock ABI10
          # full enforcement remains the capable-kernel whole-image device gate.
          PF_APP_REQUIRE_NAMESPACE=1 tests/test-steamlink-first-run-install.sh

      - name: Remove private pair output
        if: always()
        run: |
          if test -n "${PF_PAIR_OUTPUT:-}" && test -d "$PF_PAIR_OUTPUT"; then
            find "$PF_PAIR_OUTPUT" -mindepth 1 -delete
            rmdir "$PF_PAIR_OUTPUT"
          fi
