name: App policy paired contract

on:
  pull_request:
    paths:
      - '.github/workflows/app-policy-pair.yml'
      - 'scripts/render-app-runtime-root.py'
      - 'scripts/render-platform-capabilities.py'
      - 'scripts/install-poolsuite.sh'
      - 'scripts/check-runtime-path-producers.py'
      - 'build/app-policy-a133-open-v1.json'
      - 'rootfs-overlay/usr/share/pocketforge/runtime-path-producers.json'
      - 'build/Dockerfile.pf'
      - 'tests/test-app-runtime-root.sh'
      - 'tests/test_app_runtime_root.py'
      - 'tests/test_app_runtime_abi.py'
      - 'tests/test-default-app-platform.sh'
      - 'tests/test-poolsuite-app-policy.sh'
      - 'tests/test-poolsuite-rootfs-install.sh'
      - 'tests/test-poolsuite-variant-stage.sh'
      - 'tests/test-runtime-path-producers.sh'
      - 'tests/fixtures/app-policy/platform-capabilities-a133-open.toml'

permissions:
  contents: read

jobs:
  pair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-ci]
    timeout-minutes: 15
    container:
      image: 10.0.32.86:5555/pocketforge/ci-rust@sha256:801f15f7e8fd20b449e3b0d0a7a56d632e28dae825b251a19a30e6f8b32bd8e9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pocketforge-os/runtime
          ref: 187f1b1ada523424a48c11d053dba69791296d31
          path: runtime-pair
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pocketforge-os/launcher
          ref: 8a276aecf087d32a143d9db0d7a895d7f8222796
          path: launcher-pair
      - name: Prove exact runtime, launcher, and image candidates together
        run: |
          test "$(git -C runtime-pair rev-parse HEAD)" = 187f1b1ada523424a48c11d053dba69791296d31
          test "$(git -C launcher-pair rev-parse HEAD)" = 8a276aecf087d32a143d9db0d7a895d7f8222796
          scripts/check-launcher-runtime-contract.sh launcher-pair runtime-pair \
            pf-app-launch pf-app-manifest pf-scene pf-ports pf-render pf-framehost \
            pf-framehost-wayland pf-theme pf-input-map pf-prefs pf-prefs-port \
            pf-session-client pf-session-authority pf-wire
          (cd runtime-pair && cargo build --locked \
            --manifest-path Cargo.toml \
            -p pf-app-launch --bin pf-app-policy-render \
            --target-dir target)
          export PF_APP_POLICY_RENDER="$GITHUB_WORKSPACE/runtime-pair/target/debug/pf-app-policy-render"
          printf 'runtime_candidate=%s launcher_candidate=%s image_candidate=%s policy_renderer_sha256=%s\n' \
            "$(git -C runtime-pair rev-parse HEAD)" \
            "$(git -C launcher-pair rev-parse HEAD)" \
            "$(git rev-parse HEAD)" \
            "$(sha256sum "$PF_APP_POLICY_RENDER" | cut -d' ' -f1)"
          tests/test-app-runtime-root.sh
          tests/test-default-app-platform.sh
          tests/test-runtime-path-producers.sh
