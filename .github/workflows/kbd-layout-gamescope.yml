name: keyboard layout end-to-end (headless gamescope)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/kbd-layout-gamescope.yml
      - tests/test-kbd-layout-gamescope.sh
      - tests/kbd-layout-harness/**
      - tests/input-harness/**
      - rootfs-overlay/usr/lib/pocketforge/kbd-layout-env
      - rootfs-overlay/etc/systemd/system/pf-kbd-layout-env.service

permissions:
  contents: read

concurrency:
  group: kbd-layout-gamescope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Probe prerequisites (fail closed)
        id: probe
        run: |
          set -uo pipefail
          ready=true
          report() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          for f in tests/test-kbd-layout-gamescope.sh \
                   tests/kbd-layout-harness/entry.sh; do
            bash -n "$f" || { report "kbd-probe: FAIL $f bash -n"; ready=false; }
          done
          python3 -m py_compile tests/kbd-layout-harness/driver.py ||
            { report "kbd-probe: FAIL driver.py py_compile"; ready=false; }
          if [ ! -d tests/input-harness ]; then
            report "kbd-probe: MISSING_PREREQUISITE tests/input-harness (tsp-ihne1.2)"
            ready=false
          fi
          if ! command -v docker >/dev/null 2>&1; then
            report "kbd-probe: MISSING_PREREQUISITE docker not found on PATH"
            ready=false
          elif ! docker info >/dev/null 2>&1; then
            report "kbd-probe: MISSING_PREREQUISITE docker daemon unreachable"
            ready=false
          fi
          if [ ! -e /dev/uinput ]; then
            report "kbd-probe: MISSING_PREREQUISITE /dev/uinput absent on runner"
            ready=false
          fi
          if [ "$ready" = true ]; then
            report "kbd-probe: ready"
          else
            exit 1
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  live:
    needs: probe
    if: >-
      needs.probe.result == 'success' &&
      needs.probe.outputs.ready == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, pf-builder-vm]
    # Cold builds compile the pinned gamescope fork inside the harness
    # container; the budget is for that build, not for a growing test.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run keyboard-layout end-to-end harness
        run: |
          set -o pipefail
          tests/test-kbd-layout-gamescope.sh 2>&1 |
            tee "$RUNNER_TEMP/kbd-layout-gamescope.log"

      - name: Publish evidence
        if: always()
        run: |
          {
            echo '## keyboardLayout end-to-end (headless gamescope)'
            echo '```text'
            grep -E '^(==>|    committed|PASS:|FAIL:|MISSING_PREREQUISITE:)' \
              "$RUNNER_TEMP/kbd-layout-gamescope.log" 2>/dev/null ||
              echo 'no receipt'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
