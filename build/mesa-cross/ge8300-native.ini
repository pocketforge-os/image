[binaries]
c = ['ccache', 'gcc']
cpp = ['ccache', 'g++']
ar = 'gcc-ar'
strip = 'strip'
pkg-config = '/usr/local/bin/x86_64-linux-gnu-pkg-config'
llvm-config = 'llvm-config-20'
python = 'python3'

[built-in options]
c_args = ['-ffile-prefix-map=/src=.', '-fdebug-prefix-map=/src=.']
cpp_args = ['-ffile-prefix-map=/src=.', '-fdebug-prefix-map=/src=.']
