[binaries]
c = ['ccache', 'aarch64-linux-gnu-gcc']
cpp = ['ccache', 'aarch64-linux-gnu-g++']
ar = 'aarch64-linux-gnu-gcc-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = '/usr/local/bin/aarch64-linux-gnu-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
c_args = ['-ffile-prefix-map=/src/build-cross-a=build-cross', '-ffile-prefix-map=/src/build-cross-b=build-cross', '-ffile-prefix-map=/src=.', '-fdebug-prefix-map=/src/build-cross-a=build-cross', '-fdebug-prefix-map=/src/build-cross-b=build-cross', '-fdebug-prefix-map=/src=.']
cpp_args = ['-ffile-prefix-map=/src/build-cross-a=build-cross', '-ffile-prefix-map=/src/build-cross-b=build-cross', '-ffile-prefix-map=/src=.', '-fdebug-prefix-map=/src/build-cross-a=build-cross', '-fdebug-prefix-map=/src/build-cross-b=build-cross', '-fdebug-prefix-map=/src=.']
c_link_args = ['-Wl,--build-id=sha1']
cpp_link_args = ['-Wl,--build-id=sha1']
pkg_config_path = []
