# Image-owned (10-policy.conf is runtime-rendered and must stay byte-identical to the renderer).
# The non-optional BindPaths=/dev/input/pf-app-pad:/dev/input/event0 in 10-policy.conf needs the
# broker's App Pad and its udev symlink to exist first. Fail-closed is unchanged: no optional bind.
# No Wants=: the broker conflicts with the shell and is started by the session target, not by apps.
[Unit]
After=pf-input-broker.service

[Service]
# '+' = run un-sandboxed (outside the unit's mount namespace, which would itself fail without the pad).
ExecStartPre=+/usr/bin/udevadm settle --timeout=5
