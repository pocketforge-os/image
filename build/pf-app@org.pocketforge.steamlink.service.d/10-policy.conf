[Service]
SupplementaryGroups=audio input pf-session video
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
PrivateNetwork=no
InaccessiblePaths=-/run/dbus/system_bus_socket
BindReadOnlyPaths=/dev/dri
BindReadOnlyPaths=/dev/input/event0
BindReadOnlyPaths=/dev/urandom
BindReadOnlyPaths=/proc/cpuinfo
BindReadOnlyPaths=/proc/meminfo
BindReadOnlyPaths=/proc/stat
BindReadOnlyPaths=/proc/sys/vm/overcommit_memory
BindReadOnlyPaths=/run/pocketforge/session/environment
BindReadOnlyPaths=/run/pocketforge/x11/policy/environment
BindReadOnlyPaths=/sys/class/drm
BindReadOnlyPaths=/sys/dev/char
BindReadOnlyPaths=/sys/devices/platform
BindReadOnlyPaths=/sys/devices/system/cpu
BindPaths=/dev/dri/renderD128
BindPaths=/dev/snd/controlC0
BindPaths=/dev/snd/pcmC0D0p
BindPaths=/dev/snd/timer
BindPaths=/run/pocketforge/session/wayland-0
BindPaths=/run/pocketforge/x11/.X11-unix/X0:/tmp/.X11-unix/X0
DeviceAllow=/dev/dri/renderD128 rw
DeviceAllow=/dev/input/event0 r
DeviceAllow=/dev/snd/controlC0 rw
DeviceAllow=/dev/snd/pcmC0D0p rw
DeviceAllow=/dev/snd/timer rw
