%YAML 1.2
---
$id: http://devicetree.org/schemas/pocketforge,container-test.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PocketForge build-container schema smoke test

maintainers:
  - PocketForge CI <ci@pocketforge.org>

description: |
  Minimal binding used only to prove that the hermetic build container can
  validate a known-good devicetree schema.

properties:
  compatible:
    const: pocketforge,container-test

required:
  - compatible

additionalProperties: false

examples:
  - |
    test-device {
        compatible = "pocketforge,container-test";
    };
...
