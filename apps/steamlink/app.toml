schema_version = 2

[app]
id = "org.pocketforge.steamlink"
name = "Steam Link"
version = "1.3.32.316"
category = "stream"
use = ["audio", "input", "x11", "egress:tcp/443@*"]

[runtime]
family = "pocketforge/a133-powervr"
abi = "1"
platform-version = "20"

[launch]
exec = "bin/pf-launch"
needs_network = true
takes_display = true
audio = true

[display]
orientations = ["landscape"]
