# Harness descriptor with the production schema-2 facts consumed by the image's
# platform-contract renderer. The app also reads this through PF_DESCRIPTOR while
# the authority resolves the sole descriptor from the production devices tree.
schema_version = 2

[identity]
id = "a133"

[memory]
physical_mib = 970
app_budget_mib = 600

[graphics]
gles_max = "3.0"

[[screens]]
id = "screen_main"
role = "primary"
rotation = "cw90"
render_canvas = { w = 1280, h = 720 }

[[inputs]]
id = "south"
kind = "button"
