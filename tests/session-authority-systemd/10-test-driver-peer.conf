[Service]
# The production daemon accepts full-access requests only from its configured
# service cgroup. The integration driver must remain available while the real
# selected-owner fixture is stopped, so it has its own test-only peer identity.
ExecStart=
ExecStart=/usr/bin/pf-session-authorityd --state-dir /var/lib/pocketforge/session-authority --socket /run/pocketforge/session-authority.sock --shell-user root --shell-unit session-authority-driver.service
