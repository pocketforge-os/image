# Test-only framebuffer prerequisite. The container's private /dev hides image
# contents, so systemd-tmpfiles recreates this as a regular file during boot.
f /dev/fb0 0600 root root -
# Test-only input prerequisites (bd: tsp-f3fm.202.1.4). Regular files, never
# device nodes: the broker drop-in asserts /dev/uinput, and the fake broker
# requires its --source path to exist. drive.py removes /dev/uinput to prove a
# broker start failure keeps the app from starting.
f /dev/uinput 0600 root root -
d /dev/input 0755 root root -
f /dev/input/pf-gamepad 0640 root input -
# The grab model: one flock file both fakes contend for, plus their evidence logs.
d /run/pf-grab 0777 root root -
f /run/pf-grab/pf-gamepad.lock 0666 root root -
