# Boot-time sweep of pf-app-fetch leftovers (bd tsp-ziac.4.3.5, design N7).
# A run killed mid-transaction can leave a staging tree or a moved-aside old
# payload under .pf-fetch/. Each run sweeps them too (step 1); this removes them
# at boot, before any fetch can start, so they never hold space across reboots.
# Never touches receipt.json, result.json or any <dest>.
R /var/lib/pocketforge/apps/*/.pf-fetch/.staging.*
R /var/lib/pocketforge/apps/*/.pf-fetch/.old.*
