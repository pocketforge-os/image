# Door drop-in for an X11 GTK/Qt app (bd: tsp-ihne1.5).
#
# Installed as /etc/systemd/system/pf-app@<app>.service.d/20-ime-door.conf for
# an app whose manifest asks for an X11 input method; never for Wayland apps,
# which get text only through gamescope's text-input protocol and no bus.
# pf-app@.service hides every door under an empty tmpfs; this binds back only
# the app's own. XIM stays off in v1 (snoopable on a shared X server).
[Unit]
Requires=pf-ime-door@%i.service
After=pf-ime-door@%i.service

[Service]
BindPaths=/run/pf-ime-door/%i
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/pf-ime-door/%i/bus
Environment=GTK_IM_MODULE=fcitx QT_IM_MODULE=fcitx XMODIFIERS=@im=none
