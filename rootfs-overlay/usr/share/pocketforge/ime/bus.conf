<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  PocketForge private input-method bus (bd: tsp-ihne1.5).

  Carries pf-osk <-> pf-fcitx5 traffic and the upstream side of every per-app
  input-method door (pf-ime-door@.service). Apps never connect here: they run
  as `gamer`, the socket directory is 0700 pf-ime, pf-app@.service makes
  /run/pf-ime inaccessible, and this policy admits only uid pf-ime. X11 apps
  reach the engine only through their own filtered door.

  tests/test-ime-bus-security.sh runs a real dbus-daemon on this exact file.
-->
<busconfig>
  <type>pf-ime</type>
  <listen>unix:path=/run/pf-ime/bus</listen>
  <auth>EXTERNAL</auth>

  <!-- No activation: every peer is a supervised systemd unit. -->
  <servicedir>/nonexistent/pf-ime-no-activation</servicedir>

  <policy context="default">
    <!-- Connect: uid pf-ime only (keyboard, engine and door proxies). -->
    <deny user="*"/>
    <allow user="pf-ime"/>

    <!-- Nobody listens in, not even pf-ime peers. -->
    <deny eavesdrop="true"/>
    <deny send_type="method_call" send_interface="org.freedesktop.DBus.Monitoring"/>

    <!-- Name ownership: default deny, then the engine and keyboard names. -->
    <deny own="*"/>
    <allow own="org.fcitx.Fcitx5"/>
    <allow own="org.freedesktop.portal.Fcitx"/>
    <allow own_prefix="org.pocketforge.Osk"/>

    <allow send_destination="*" eavesdrop="false"/>
    <allow receive_sender="*" eavesdrop="false"/>
  </policy>

  <!-- Sized for two keyboard peers plus one door connection per X11 app. -->
  <limit name="max_completed_connections">32</limit>
  <limit name="max_incomplete_connections">8</limit>
  <limit name="max_connections_per_user">32</limit>
  <limit name="max_names_per_connection">8</limit>
  <limit name="max_match_rules_per_connection">64</limit>
  <limit name="max_incoming_bytes">1048576</limit>
  <limit name="max_outgoing_bytes">1048576</limit>
  <limit name="max_message_size">65536</limit>
  <limit name="max_replies_per_connection">64</limit>
  <limit name="auth_timeout">5000</limit>
</busconfig>
