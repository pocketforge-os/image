# Provisional VM tuning pending the tsp-r45im device bake-off (bd: tsp-z8vav).
# Prefer zram reclaim, avoid swap readahead amplification, keep allocator
# reserves responsive, and do not boost watermarks after fragmentation events.
vm.swappiness = 100
vm.page-cluster = 0
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0
