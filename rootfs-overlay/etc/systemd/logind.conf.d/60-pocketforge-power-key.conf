# Short release opens the selected shell's Quick actions through pf-powerd.
# No handle-power-key inhibitor: logind must retain graceful shutdown when the
# shell or powerd is absent. systemd 252.39 uses a five-second long-press timer.
# This does not change PMIC forced-off timing or enable unproven suspend.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
