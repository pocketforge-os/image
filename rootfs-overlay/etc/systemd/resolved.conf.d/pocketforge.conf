[Resolve]
# DHCP-provided per-link DNS from systemd-networkd takes precedence. These are
# used only when no link supplies a suitable DNS server.
FallbackDNS=1.1.1.1 9.9.9.9
# Opportunistic DNS-over-TLS (bd tsp-be9lx): resolved upgrades to DoT for
# servers that advertise it (RFC 7858) and falls back to plain DNS otherwise,
# so browsing gains encryption where possible without breaking resolvers or
# captive portals that lack DoT.
DNSOverTLS=opportunistic
