# Session-wide input router. The gamescope session target pulls this unit in once; individual
# app units never control its lifetime. It is not enabled at boot, so the framebuffer shell owns
# the physical pad outside a gamescope session.
[Unit]
PartOf=pocketforge-gamescope-session.target
OnFailure=pocketforge-gamescope-fallback.service
After=pf-input-decode.service pf-prefsd.service
Conflicts=pf-shell-selected.service
# The supervisor counts failures per session. A systemd start limit would also count
# successful starts and incorrectly spend the next clean session's retry allowance.
StartLimitIntervalSec=0
# A missing uinput node must fail the session instead of making the inherited condition skip it.
ConditionPathExists=

[Service]
Slice=pfsession.slice
OOMScoreAdjust=-900
ExecStartPre=/usr/bin/test -e /dev/uinput
Group=gamer
UMask=0007
Environment=PF_PREFSD_SOCK=/run/pocketforge/prefsd.sock
# The supervisor retries the broker once and returns failure only after both attempts fail.
# systemd then invokes OnFailure exactly once; this works on the image's systemd version,
# which predates RestartMode=direct.
Restart=no
NotifyAccess=all
# Deliver TERM only to the supervisor, which forwards it once and waits for the broker's
# release. If that wait exceeds TimeoutStopSec, mixed mode still SIGKILLs the full cgroup.
KillMode=mixed
ExecStart=
ExecStart=/usr/lib/pocketforge/pf-input-broker-supervisor /usr/bin/pf-input-broker --descriptor /usr/share/pocketforge/device/capabilities.toml --acquire-sock /run/pocketforge/input-broker.sock --source /dev/input/pf-gamepad --safe-return-sock /run/pocketforge/session-authority.sock --system-menu-sock /run/pocketforge/system-menu.sock --compositor-sock /run/pocketforge/input/compositor.sock
