# App-session scope for runtime's pf-input-broker.service (bd: tsp-f3fm.202.1 ruling (i), B4).
#
# The runtime unit is installed verbatim and is NEVER enabled: its [Install]
# WantedBy=multi-user.target would grab /dev/input/pf-gamepad at boot and break
# pf-shell's EVIOCGRAB. pf-app@.service pulls it in (Requires=/After=) for the
# lifetime of one default-app session only; StopWhenUnneeded= stops it when the
# app unit goes inactive.
#
# Grab order (docs/DEFAULT-APPS.md "Input delivery"):
#   launch:  pf-shell-selected stop  ->  foreground target start  ->  broker start
#            (grab, then READY=1)    ->  pf-app@<id> start
#   return:  pf-app@<id> inactive    ->  broker stop (grab released at exit)
#            ->  target stop  ->  OnSuccess= pf-shell-selected start (grab)
# Conflicts= keeps the shell and the broker from ever being active together;
# the shell's After=pf-input-broker.service drop-in orders its start behind the
# broker's stop whenever both jobs are queued.
[Unit]
StopWhenUnneeded=yes
# Re-arms the target's StopWhenUnneeded= when the broker fails (bd:
# tsp-f3fm.202.1.6). systemd re-checks a StopWhenUnneeded= unit only when a unit
# that pulls it in changes state. A broker that runs and then exits before
# READY fails pf-app@'s start job as a dependency, but the app unit itself never
# changes state, so nothing re-checks the target: it stays active and the shell
# never returns (real-systemd harness, case (a) with Restart=no alone). With
# Wants=, the broker's own failed/inactive transition queues the target, and by
# then no app job pins it. pf-app@ already pulls in both units, and the broker
# is never enabled, so this adds no unit to any transaction.
Wants=pocketforge-foreground.target
After=pocketforge-foreground.target pf-input-decode.service pf-prefsd.service
Conflicts=pf-shell-selected.service
# Fail, never skip. The runtime unit's ConditionPathExists=/dev/uinput turns a
# missing uinput node into a SKIPPED (successful) start, and pf-app@'s
# Requires= would then start the app with no input and no Menu intake: a user
# trapped in the app. An empty assignment resets the inherited condition list;
# the assertion fails the broker job, so the dependent app job fails instead.
ConditionPathExists=
AssertPathExists=/dev/uinput

[Service]
# Acquire and SafeReturn sockets: root:gamer 0770. The app (User=gamer) can
# reach the acquire socket; the broker can reach the root:gamer 0770 authority.
Group=gamer
UMask=0007
Environment=PF_PREFSD_SOCK=/run/pocketforge/prefsd.sock
# Fail ONCE, never restart (bd: tsp-f3fm.202.1.6). The runtime unit's
# Restart=on-failure/RestartSec=2 is right for a boot-long broker, but here every
# restart is a new start job, and each start honours Conflicts= above and stops
# the shell again. On device (.215 bench-r2), a broker that exited 1 right after
# start restarted 66 times while the launcher stayed down and the authority
# stalled in Restoring: a trapped user. With Restart=no, a failure before READY
# fails the start job, so the app job fails as a dependency. A failure after
# READY stops the app through pf-app@'s BindsTo=. Either way the foreground
# target is released and OnSuccess= brings the shell back.
Restart=no
# --source pins the decoder's stable node instead of a 30 s discovery wait;
# --safe-return-sock makes the broker the protected Menu/guide intake (guide is
# withheld from the app and each press sends one safe_return to the authority).
ExecStart=
ExecStart=/usr/bin/pf-input-broker --descriptor /usr/share/pocketforge/devices/a133/capabilities.toml --acquire-sock /run/pocketforge/input-broker.sock --source /dev/input/pf-gamepad --safe-return-sock /run/pocketforge/session-authority.sock
