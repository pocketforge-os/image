# Session-wide input router. The gamescope session target pulls this unit in once; individual
# app units never control its lifetime. It is not enabled at boot, so the framebuffer shell owns
# the physical pad outside a gamescope session.
[Unit]
PartOf=pocketforge-gamescope-session.target
OnFailure=pocketforge-gamescope-fallback.service
After=pf-input-decode.service pf-prefsd.service
Conflicts=pf-shell-selected.service
StartLimitIntervalSec=30s
StartLimitBurst=2
# A missing uinput node must fail the session instead of making the inherited condition skip it.
ConditionPathExists=

[Service]
Slice=pfsession.slice
OOMScoreAdjust=-900
ExecStartPre=/usr/bin/test -e /dev/uinput
Group=gamer
UMask=0007
Environment=PF_PREFSD_SOCK=/run/pocketforge/prefsd.sock
# The first failure restarts directly, without running OnFailure. The second failure exhausts the
# two-start limit and enters failed, activating the session fallback and selected shell.
Restart=on-failure
RestartSec=0
RestartMode=direct
ExecStart=
ExecStart=/usr/bin/pf-input-broker --descriptor /usr/share/pocketforge/device/capabilities.toml --acquire-sock /run/pocketforge/input/sdk.sock --source /dev/input/pf-gamepad --safe-return-sock /run/pocketforge/session-authority.sock --system-menu-sock /run/pocketforge/input/menu.sock --compositor-sock /run/pocketforge/input/compositor.sock --session-user gamer
