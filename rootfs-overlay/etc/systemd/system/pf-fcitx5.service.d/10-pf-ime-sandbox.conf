# Keyboard-process sandbox for pf-fcitx5 (bd: tsp-ihne1.5).
#
# Applies to whatever pf-fcitx5.service the engine bead installs. The engine
# runs as pf-ime, a uid no app shares, so apps cannot ptrace it or read its
# memory; it has no network, no core dumps and no devices (the keyboard gets
# the pad from the router over a private socket). Its only bus is the private
# one; apps never see it. The same lines are in 10-pf-ime-sandbox.conf for
# pf-osk; tests/verify-ime-bus-wiring.py keeps the two identical.
[Unit]
Requires=pf-ime-bus.service
After=pf-ime-bus.service

[Service]
User=pf-ime
Group=pf-ime
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/pf-ime/bus
LimitCORE=0
NoNewPrivileges=yes
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX
IPAddressDeny=any
PrivateDevices=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
CapabilityBoundingSet=
