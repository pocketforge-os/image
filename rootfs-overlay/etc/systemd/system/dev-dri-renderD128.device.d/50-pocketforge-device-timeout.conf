# Bound the open GPU gate's wait for the render node (bd tsp-3rd3.18).
#
# The gate Wants and orders After dev-dri-renderD128.device. The device job
# starts when the boot transaction is queued: k7.49-7.72 on all 11 B6/B7 boots.
# Without this drop-in the job waits systemd's 90 s default for a GPU that never
# probes. The worst observed arrival was 9.87 s after the job started (B7 B4,
# including the boots where the XR829 firmware upload held the node). 30 s is
# about 3x that.
#
# On timeout systemd logs "Timed out waiting for device" for the render node.
# The gate then runs anyway (Wants, not Requires) and fails by name:
# "PF-OPEN-GPU FAIL: /dev/dri/renderD128 is absent" (or "powervr is not loaded").
# The UI units then fail through pf-open-gpu-required.conf.
#
# This is the form systemd-fstab-generator writes for the image's own /boot
# x-systemd.device-timeout=10s entry (tests/test-open-gpu-gate-ordering.sh
# checks that the two forms match).
[Unit]
JobRunningTimeoutSec=30s
