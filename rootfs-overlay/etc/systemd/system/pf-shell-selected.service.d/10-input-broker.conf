# Order the selected shell's start behind the app-session broker's stop
# (bd: tsp-f3fm.202.1 ruling (i), B4). A stop job is always ordered before a
# start job when the two units share any ordering dependency, so on return the
# broker releases its EVIOCGRAB on /dev/input/pf-gamepad before pf-shell grabs
# it. The broker is never part of the boot transaction, so this is inert there.
[Unit]
After=pf-input-broker.service
