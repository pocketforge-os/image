[Unit]
Wants=pf-hang-sampler.socket
After=pf-hang-sampler.socket

[Service]
ExecStart=
ExecStart=/usr/bin/pf-session-authorityd --state-dir /var/lib/pocketforge/session-authority --socket /run/pocketforge/session-authority.sock --compositor-user pf-gamescope --compositor-unit pocketforge-gamescope.service --hang-sampler-socket /run/pocketforge/hang-sampler/hang-sampler.sock
