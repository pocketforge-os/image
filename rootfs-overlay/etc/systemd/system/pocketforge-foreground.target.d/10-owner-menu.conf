# 10-owner-menu.conf — the panel's owner on this image is the MVP MENU.
# bd: tsp-1cl7.1 (resolves the "KNOWN FUTURE EDGE" comment in the target itself)
#
# EXACTLY ONE 10-owner-*.conf is installed per image, by scripts/build-rootfs.sh,
# in the SAME block that creates that UI's enable symlink — the two are one
# decision and must move together. The sibling is 10-owner-animator.conf.
#
# WHY THE OWNER SELECTION IS SPLIT INTO DROP-INS AT ALL, rather than a single
# OnSuccess= in the target that a menu image overrides:
# **dependency-type settings CANNOT be reset by an empty assignment.**
# OnSuccess= / OnFailure= / Conflicts= / After= are parsed as unit dependencies,
# and unlike Environment= or ExecStart= an empty `OnSuccess=` is a NO-OP, not a
# reset. A drop-in that wrote
#     OnSuccess=
#     OnSuccess=pocketforge-menu.service
# over a target carrying OnSuccess=pocketforge-boot-animator.service MERGES to
# `OnSuccess=animator menu` — and on the app's exit systemd starts BOTH, as two
# independent jobs, so the menu's own Conflicts= never serialises against the
# animator and both end up running. Two fb0 writers: the exact invariant this
# slot exists to hold (tsp-ikk0.11 / tsp-7kpp). Found empirically in a local
# systemd --user repro before landing — the docs do not say either way, so do
# not "simplify" this back to an override without re-running that repro.
# The target therefore ships with NO OnSuccess=, and the selected drop-in ADDS
# the one correct successor to an empty list. That also degrades safely: a
# missing drop-in means no restore, never a WRONG restore.
#
# WHY BUILD TIME: which UI owns the panel is fixed by the enable-symlink swap,
# not discovered at runtime. systemd has no "restore whichever unit was
# previously running" primitive, and adding one (a helper unit that records the
# last owner) is machinery this explicitly-temporary menu does not warrant.
#
# WHAT THIS ADDS, both halves of the seam preserved:
#   START — Conflicts=/After= the menu, declared HERE (target-side). Without it
#     an app taking the slot does NOT stop the menu, because the target's own
#     Conflicts= names only the animator. Target-side is REQUIRED: when the
#     target is pulled in as a Requires= of an app unit (the systemd-run /
#     pf-take-panel path, i.e. the normal one) systemd does not enforce the
#     *conflicting* unit's own declaration — see the target file. After= then
#     orders the app behind the menu's stop.
#   EXIT — OnSuccess= restores the MENU, so an app exiting does not revive the
#     boot animator over the MainUI. The menu's own Conflicts= keeps the
#     animator down.

[Unit]
Conflicts=pocketforge-menu.service
After=pocketforge-menu.service
OnSuccess=pocketforge-menu.service
