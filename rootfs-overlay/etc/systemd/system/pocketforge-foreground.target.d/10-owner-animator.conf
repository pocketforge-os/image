# 10-owner-animator.conf — the panel's owner on this image is the BOOT ANIMATOR.
# bd: tsp-1cl7.1
#
# This is TODAY'S BEHAVIOUR, unchanged, just relocated: the target used to carry
# OnSuccess=pocketforge-boot-animator.service inline. It moved here so that the
# successor can be selected per image without an override — see the sibling
# 10-owner-menu.conf for why an override is not possible (dependency-type
# settings cannot be reset by an empty assignment, so an override MERGES and the
# slot ends up restoring two fb0 writers).
#
# Install this one on any image where the animator is the enabled UI, i.e. the
# documented one-symlink-swap recovery in scripts/build-rootfs.sh. Exactly one
# 10-owner-*.conf per image, installed alongside that UI's enable symlink.
#
# The target's own Conflicts=/After= on the animator stay in the target file:
# the animator must be stopped when the slot is taken on EVERY image variant,
# so that half is not owner-dependent. Only the restore is.

[Unit]
OnSuccess=pocketforge-boot-animator.service
