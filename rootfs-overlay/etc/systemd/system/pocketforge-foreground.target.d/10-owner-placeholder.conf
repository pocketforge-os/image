# 10-owner-placeholder.conf — the panel's owner on this image is the PLACEHOLDER.
# bd: tsp-1cl7.1
#
# For the documented one-symlink-swap recovery variant, where
# pocketforge-placeholder.service is the enabled UI instead of the menu.
# Exactly one 10-owner-*.conf is installed per image, by scripts/build-rootfs.sh,
# alongside that UI's enable symlink. Siblings: 10-owner-animator.conf,
# 10-owner-menu.conf.
#
# THIS DELIBERATELY DOES NOT PRESERVE TODAY'S BEHAVIOUR, and that is the point.
# The base target used to restore the animator unconditionally, so on a
# placeholder image an app exiting the slot would revive the boot animator OVER
# the placeholder — the exact defect this bead fixes for the menu, just on a
# variant nobody had exercised. Keeping it would have shipped a known-wrong
# restore on one of the three UIs. The rule is uniform instead, and therefore
# hard to get subtly wrong later: THE ENABLED UI IS THE RESTORED UI.
#
# Same two halves as the menu drop-in. Conflicts=/After= must be declared
# target-side, because systemd does not enforce the *conflicting* unit's own
# declaration when the target is pulled in as a Requires= of an app unit (the
# systemd-run / pf-take-panel path) — see the target file. OnSuccess= then
# restores the placeholder; its own Conflicts=pocketforge-boot-animator.service
# keeps the animator down.

[Unit]
Conflicts=pocketforge-placeholder.service
After=pocketforge-placeholder.service
OnSuccess=pocketforge-placeholder.service
