# Provisional memory policy for ~1 GiB PocketForge devices (bd: tsp-z8vav).
# zram-size=ram tracks MemTotal instead of baking one board's capacity into the
# image. Compressed pages remain in RAM; this does not enable SD-backed swap.
[zram0]
zram-size = ram
compression-algorithm = lz4
swap-priority = 100
